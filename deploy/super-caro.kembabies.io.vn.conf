# Host Nginx (AlmaLinux) -> /etc/nginx/conf.d/super-caro.kembabies.io.vn.conf, rồi:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d super-caro.kembabies.io.vn
# HTTPS là bắt buộc: bản web của Godot chỉ chạy trong "secure context".

# Chỉ gửi "Connection: upgrade" khi client thật sự xin WebSocket. Tên biến riêng
# để không đụng map của vhost khác (cùng nằm trong khối http).
map $http_upgrade $super_caro_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name super-caro.kembabies.io.vn;

    access_log /var/log/nginx/super-caro.access.log;
    error_log  /var/log/nginx/super-caro.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $super_caro_connection;
        # WebSocket của trận đấu: sảnh/phòng chờ có thể im lặng lâu.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
