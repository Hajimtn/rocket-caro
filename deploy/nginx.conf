# nginx BÊN TRONG container `web`. Host nginx (TLS) chuyển mọi thứ vào đây.
# Game mở WebSocket tới đúng địa chỉ trang (wss://super-caro.kembabies.io.vn/),
# nên request nào có "Upgrade: websocket" thì đi sang trọng tài Godot, còn lại
# là file tĩnh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    # File không có hash trong tên (index.wasm...), nên luôn hỏi lại bằng ETag:
    # deploy bản mới là người chơi nhận ngay, không kẹt bản cũ trong cache.
    add_header Cache-Control "no-cache" always;

    location / {
        error_page 418 = @game;
        if ($http_upgrade ~* "websocket") {
            return 418;
        }
        try_files $uri $uri/ =404;
    }

    # Tài khoản. Chỉ /api/ ra ngoài; /internal/ của dịch vụ chỉ `game` gọi được, trong mạng compose.
    location /api/ {
        proxy_pass http://accounts:8000;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        # IP thật do host nginx đặt (từ kết nối TCP), dùng để chặn dò mật khẩu.
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 8k;
        add_header Cache-Control "no-store" always;
    }

    location @game {
        proxy_pass http://game:24571;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Sảnh/phòng chờ có thể im lặng rất lâu; mặc định 60s sẽ cắt kết nối.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
