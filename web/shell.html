<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- Rocket Caro loading screen: replaces Godot's default shell (logo + bare progress bar). -->
		<style>
:root {
	--bg: #0b2027;
	--panel: #13303a;
	--text: #f5f2df;
	--muted: #8cafb1;
	--accent: #e9f48b;
	--x: #ff8a6e;
	--o: #6cbcff;
	--grid: #2c4c52;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--text);
	background-color: var(--bg);
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans', Roboto, Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	padding: 0 16px;
	background:
		radial-gradient(ellipse at 50% 40%, rgba(233, 244, 139, 0.07), transparent 60%),
		linear-gradient(rgba(140, 175, 177, 0.06) 1px, transparent 1px) 0 0 / 40px 40px,
		linear-gradient(90deg, rgba(140, 175, 177, 0.06) 1px, transparent 1px) 0 0 / 40px 40px,
		var(--bg);
	visibility: hidden;
	transition: opacity 0.5s ease;
	z-index: 1;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

/* the little scene: a 5x5 board being filled by rockets */
#scene {
	width: min(280px, 70vw);
	height: auto;
	overflow: visible;
}

.cell-line {
	stroke: var(--grid);
	stroke-width: 1.5;
}

.frame {
	fill: #102a31;
	stroke: #3c6066;
	stroke-width: 3;
	rx: 6;
}

.mark {
	fill: none;
	stroke-width: 5;
	stroke-linecap: round;
	opacity: 0;
	animation: mark 6s infinite;
}

.mark.x { stroke: var(--x); }
.mark.o { stroke: var(--o); }

@keyframes mark {
	0% { opacity: 0; transform: scale(0.4); }
	4% { opacity: 1; transform: scale(1.15); }
	7%, 88% { opacity: 1; transform: scale(1); }
	96%, 100% { opacity: 0; transform: scale(1); }
}

.win {
	stroke: var(--accent);
	stroke-width: 4;
	stroke-linecap: round;
	stroke-dasharray: 240;
	stroke-dashoffset: 240;
	animation: win 6s infinite;
}

@keyframes win {
	0%, 62% { stroke-dashoffset: 240; opacity: 1; }
	72%, 88% { stroke-dashoffset: 0; opacity: 1; }
	96%, 100% { stroke-dashoffset: 0; opacity: 0; }
}

#rocket {
	offset-path: path('M 20 250 Q 60 60 150 112');
	offset-rotate: auto;
	animation: fly 0.75s cubic-bezier(0.3, 0.1, 0.6, 1) infinite;
}

@keyframes fly {
	0% { offset-distance: 0%; opacity: 0; }
	10% { opacity: 1; }
	85% { opacity: 1; }
	100% { offset-distance: 100%; opacity: 0; }
}

.puff {
	fill: var(--accent);
	opacity: 0;
	transform-origin: 150px 112px;
	animation: puff 0.75s infinite;
}

@keyframes puff {
	0%, 80% { opacity: 0; transform: scale(0.2); }
	88% { opacity: 0.8; transform: scale(1); }
	100% { opacity: 0; transform: scale(1.6); }
}

#title {
	text-align: center;
}

#title h1 {
	margin: 0;
	font-size: clamp(32px, 7vw, 52px);
	font-weight: 800;
	letter-spacing: 0.02em;
	line-height: 1;
}

#title h1 span {
	color: var(--accent);
}

#title p {
	margin: 10px 0 0;
	font-size: 12px;
	font-weight: 600;
	letter-spacing: 0.18em;
	color: var(--muted);
	text-transform: uppercase;
}

#loader {
	width: min(360px, 100%);
	display: flex;
	flex-direction: column;
	gap: 8px;
}

#bar {
	height: 10px;
	border-radius: 999px;
	background: var(--panel);
	border: 1px solid rgba(255, 255, 255, 0.12);
	overflow: hidden;
}

#bar-fill {
	height: 100%;
	width: 0%;
	border-radius: 999px;
	background: linear-gradient(90deg, #c9d86a, var(--accent));
	transition: width 0.2s ease;
}

#bar.indeterminate #bar-fill {
	width: 35%;
	animation: slide 1.1s ease-in-out infinite;
}

@keyframes slide {
	0% { transform: translateX(-100%); }
	100% { transform: translateX(300%); }
}

#bar-text {
	display: flex;
	justify-content: space-between;
	font-size: 13px;
	color: var(--muted);
	font-variant-numeric: tabular-nums;
}

#status-notice {
	display: none;
	box-sizing: border-box;
	width: min(520px, 100%);
	background-color: #4a2b33;
	border: 1px solid #9b3943;
	border-radius: 10px;
	color: #f2dede;
	line-height: 1.4;
	padding: 14px 18px;
	text-align: center;
	font-size: 14px;
}

@media (prefers-reduced-motion: reduce) {
	.mark, .win, #rocket, .puff, #bar.indeterminate #bar-fill {
		animation: none;
	}
	.mark, .win {
		opacity: 1;
		stroke-dashoffset: 0;
	}
	#rocket, .puff {
		display: none;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<svg id="scene" viewBox="0 0 220 220" aria-hidden="true">
				<rect class="frame" x="10" y="10" width="200" height="200"></rect>
				<g>
					<line class="cell-line" x1="50" y1="10" x2="50" y2="210"></line>
					<line class="cell-line" x1="90" y1="10" x2="90" y2="210"></line>
					<line class="cell-line" x1="130" y1="10" x2="130" y2="210"></line>
					<line class="cell-line" x1="170" y1="10" x2="170" y2="210"></line>
					<line class="cell-line" x1="10" y1="50" x2="210" y2="50"></line>
					<line class="cell-line" x1="10" y1="90" x2="210" y2="90"></line>
					<line class="cell-line" x1="10" y1="130" x2="210" y2="130"></line>
					<line class="cell-line" x1="10" y1="170" x2="210" y2="170"></line>
				</g>
				<!-- X builds a diagonal, O tries to block -->
				<path class="mark x" style="transform-origin:30px 30px;animation-delay:0s" d="M 20 20 L 40 40 M 40 20 L 20 40"></path>
				<circle class="mark o" style="transform-origin:110px 70px;animation-delay:0.4s" cx="110" cy="70" r="11"></circle>
				<path class="mark x" style="transform-origin:70px 70px;animation-delay:0.8s" d="M 60 60 L 80 80 M 80 60 L 60 80"></path>
				<circle class="mark o" style="transform-origin:150px 110px;animation-delay:1.2s" cx="150" cy="110" r="11"></circle>
				<path class="mark x" style="transform-origin:110px 110px;animation-delay:1.6s" d="M 100 100 L 120 120 M 120 100 L 100 120"></path>
				<circle class="mark o" style="transform-origin:70px 150px;animation-delay:2.0s" cx="70" cy="150" r="11"></circle>
				<path class="mark x" style="transform-origin:150px 150px;animation-delay:2.4s" d="M 140 140 L 160 160 M 160 140 L 140 160"></path>
				<circle class="mark o" style="transform-origin:190px 70px;animation-delay:2.8s" cx="190" cy="70" r="11"></circle>
				<path class="mark x" style="transform-origin:190px 190px;animation-delay:3.2s" d="M 180 180 L 200 200 M 200 180 L 180 200"></path>
				<line class="win" x1="30" y1="30" x2="190" y2="190"></line>
				<circle class="puff" cx="150" cy="112" r="10"></circle>
				<g id="rocket">
					<rect x="-9" y="-3" width="14" height="6" rx="2" fill="#dfe6d0"></rect>
					<path d="M 5 -3 L 11 0 L 5 3 Z" fill="#c44836"></path>
					<path d="M -9 -3 L -15 0 L -9 3 Z" fill="#ffb347"></path>
				</g>
			</svg>
			<div id="title">
				<h1>ROCKET <span>CARO</span></h1>
				<p id="tagline">Bắn rocket · Xếp 5 ô</p>
			</div>
			<div id="loader">
				<div id="bar" class="indeterminate"><div id="bar-fill"></div></div>
				<div id="bar-text"><span id="bar-label">Đang tải…</span><span id="bar-value"></span></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// The game itself defaults to Vietnamese; the loader follows the browser so a first-time
	// English visitor is not greeted in a language they cannot read.
	const vi = (navigator.language || 'vi').toLowerCase().startsWith('vi');
	const T = vi ? {
		tagline: 'Bắn rocket · Xếp 5 ô',
		loading: 'Đang tải…',
		starting: 'Đang khởi động…',
		error: 'Lỗi',
		unknown: 'Đã xảy ra lỗi không xác định.',
		missing: 'Trình duyệt thiếu các tính năng cần để chạy game:\n',
	} : {
		tagline: 'Fire rockets · Get 5 in a row',
		loading: 'Loading…',
		starting: 'Starting…',
		error: 'Error',
		unknown: 'An unknown error occurred.',
		missing: 'Your browser is missing features the game needs:\n',
	};
	document.documentElement.lang = vi ? 'vi' : 'en';
	document.getElementById('tagline').textContent = T.tagline;
	document.getElementById('bar-label').textContent = T.loading;

	const statusOverlay = document.getElementById('status');
	const loader = document.getElementById('loader');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const barLabel = document.getElementById('bar-label');
	const barValue = document.getElementById('bar-value');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 600);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loader.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(T.error + ': ' + err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice(T.unknown);
		}
		setStatusMode('notice');
		initializing = false;
	}

	function mb(bytes) {
		return (bytes / 1048576).toFixed(1);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice(T.missing + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					bar.classList.remove('indeterminate');
					barFill.style.width = pct + '%';
					barValue.textContent = mb(current) + ' / ' + mb(total) + ' MB';
					if (current >= total) {
						barLabel.textContent = T.starting;
					}
				} else {
					bar.classList.add('indeterminate');
					barFill.style.width = '';
					barValue.textContent = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
